log_format tueka_json escape=json '{"time":"$time_iso8601","method":"$request_method","status":$status,"duration":$request_time}';

server {
    listen 80;
    server_name bot.example.com;
    access_log /var/log/nginx/tueka-access.log tueka_json;
    # Configure Certbot/TLS, then redirect this server to HTTPS.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name bot.example.com;
    access_log /var/log/nginx/tueka-access.log tueka_json;
    ssl_certificate /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    location ^~ /internal/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
