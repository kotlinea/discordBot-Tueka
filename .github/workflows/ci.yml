name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            database: postgresql://tueka_test:tueka_test_local_only@127.0.0.1:55432/tueka_test
          - os: windows-2025
            database: postgresql://postgres:root@127.0.0.1:5432/tueka_test
    runs-on: ${{ matrix.os }}
    env:
      TUEKA_TEST_DATABASE_URL: ${{ matrix.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - name: Start PostgreSQL 18 (Linux)
        if: runner.os == 'Linux'
        run: docker compose --env-file tests/postgres.env -p tueka-ci -f compose.postgres-test.yaml up -d --wait
      - name: Start PostgreSQL 17 (Windows compatibility)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PGPASSWORD: root
        run: |
          Set-Service postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17
          & "$env:PGBIN/createdb.exe" -h 127.0.0.1 -U postgres tueka_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PGBIN | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python scripts/generate_api.py --check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify logical restore (Linux)
        if: runner.os == 'Linux'
        run: python scripts/verify_postgres_restore.py --client-container tueka-ci-postgres-test-1
      - name: Verify logical restore (Windows)
        if: runner.os == 'Windows'
        run: python scripts/verify_postgres_restore.py
      - name: Stop PostgreSQL test service
        if: always() && runner.os == 'Linux'
        run: docker compose --env-file tests/postgres.env -p tueka-ci -f compose.postgres-test.yaml down

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.test -t tueka-test:ci .
      - run: docker compose --env-file tests/postgres.env -p tueka-container -f compose.postgres-test.yaml up -d --wait
      - run: docker run --rm --network tueka-container_default -e TUEKA_TEST_DATABASE_URL=postgresql://tueka_test:tueka_test_local_only@postgres-test:5432/tueka_test tueka-test:ci
      - name: Stop PostgreSQL container test service
        if: always()
        run: docker compose --env-file tests/postgres.env -p tueka-container -f compose.postgres-test.yaml down
      - run: docker build -f Dockerfile.web-test -t tueka-web-test:ci .
      - name: Web baseline
        run: |
          mkdir -p baseline
          docker run --rm --shm-size=1g -v "$PWD/baseline:/results" -e BASELINE_OUTPUT=/results tueka-web-test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-baseline
          path: baseline
          if-no-files-found: warn

  runtime-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TUEKA_TEST_DATABASE_URL: postgresql://tueka_test:tueka_test_local_only@127.0.0.1:55432/tueka_test
      TUEKA_CONTAINER_DATABASE_URL: postgresql://tueka_test:tueka_test_local_only@postgres-test:5432/tueka_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: docker build -t tueka:ci .
      - run: docker compose --env-file tests/postgres.env -p tueka-runtime -f compose.postgres-test.yaml up -d --wait
      - run: python scripts/verify_runtime_image.py --image tueka:ci --network tueka-runtime_default
      - name: Compose environments and migration gates
        run: python scripts/verify_compose.py --image tueka:ci
      - name: Snapshot restore and older-image rollback
        run: python scripts/verify_recovery.py --image tueka:ci
      - name: Full regression in production image
        run: >-
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true
          --tmpfs /tmp:rw,noexec,nosuid,size=256m --network tueka-runtime_default
          -e TUEKA_TEST_DATABASE_URL="$TUEKA_CONTAINER_DATABASE_URL" tueka:ci test
      - name: Stop isolated database
        if: always()
        run: docker compose --env-file tests/postgres.env -p tueka-runtime -f compose.postgres-test.yaml down

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git /repo --redact --log-opts="--all"
