name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compose-tasks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [python, web, runtime, secrets]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run shared Compose tasks
        run: docker compose --env-file deploy/compose.env -f compose.tools.yaml run --rm --build -T ci --group ${{ matrix.group }}
      - name: Upload task logs and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-${{ matrix.group }}
          path: artifacts/
          if-no-files-found: warn
      - name: Clean task infrastructure
        if: always()
        run: docker compose --env-file deploy/compose.env -f compose.tools.yaml down --remove-orphans
