name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py'

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.test -t tueka-test:ci .
      - run: docker run --rm --network none tueka-test:ci
      - run: docker build -f Dockerfile.web-test -t tueka-web-test:ci .
      - name: Web baseline
        run: |
          mkdir -p baseline
          docker run --rm --shm-size=1g -v "$PWD/baseline:/results" -e BASELINE_OUTPUT=/results tueka-web-test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-baseline
          path: baseline
          if-no-files-found: warn

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git /repo --redact --log-opts="--all"
