# Local development only. Stage/production use separate service credentials and volumes.
services:
  postgres-dev:
    image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: tueka_dev
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?Set POSTGRES_DEV_PASSWORD in .env.postgres-dev}
      POSTGRES_DB: tueka_dev
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tueka_dev -d tueka_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    shm_size: 256mb
volumes:
  postgres-dev-data:
