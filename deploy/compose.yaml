name: tueka-${TUEKA_ENV:?Select dev, stage or prod}

x-app: &app
  image: ${APP_IMAGE:?Set the shared application image}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  environment:
    TUEKA_ENV_FILE: /run/secrets/app_env
    DATA_DIR: /data
  secrets: [app_env]
  networks: [database, outbound]
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      TUEKA_DB_NAME: tueka_${TUEKA_ENV}
    secrets: [postgres_admin_password, database_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [database]
    shm_size: 256mb
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: [migrate]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  bot:
    <<: *app
    command: [bot]
    restart: unless-stopped
    volumes: [transcripts:/data]
    depends_on:
      migrate: {condition: service_completed_successfully}
  dashboard:
    <<: *app
    command: [dashboard]
    restart: unless-stopped
    volumes: [transcripts:/data:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
  social-worker:
    <<: *app
    command: [social-worker]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}

networks:
  database: {internal: true}
  outbound: {}
volumes:
  postgres-data: {}
  transcripts: {}
secrets:
  app_env:
    file: ${TUEKA_CONFIG_DIR:?Set a dedicated environment directory}/app.env
  postgres_admin_password:
    file: ${TUEKA_CONFIG_DIR}/postgres-admin-password
  database_password:
    file: ${TUEKA_CONFIG_DIR}/database-password
