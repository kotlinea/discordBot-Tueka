name: tueka-${TUEKA_ENV:?Select dev, stage or prod}

x-app: &app
  image: ${APP_IMAGE:?Set the shared application image}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  environment:
    TUEKA_ENV_FILE: /run/secrets/app_env
    DATA_DIR: /data
  secrets: [app_env]
  networks: [database, outbound]
  stop_grace_period: 30s
  cpus: "1.0"
  mem_limit: 768m
  pids_limit: 128
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  recovery-db:
    image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    profiles: [operations]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database]
    secrets: [database_password]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: tueka_${TUEKA_ENV}
      PGDATABASE: tueka_${TUEKA_ENV}
      PGCONNECT_TIMEOUT: "10"
    volumes: ["./deploy/recovery-db.sh:/recovery-db.sh:ro"]
    entrypoint: [sh, /recovery-db.sh]
    restart: "no"
    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  recovery-data:
    <<: *app
    profiles: [operations]
    entrypoint: [python, -m, recovery]
    command: [inspect]
    volumes: [transcripts:/data]
    restart: "no"
  postgres:
    image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      TUEKA_DB_NAME: tueka_${TUEKA_ENV}
    secrets: [postgres_admin_password, database_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks: [database]
    shm_size: 256mb
    cpus: "1.0"
    mem_limit: 768m
    pids_limit: 128
    command: [postgres, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, log_min_messages=fatal]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: [migrate]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  bot:
    <<: *app
    command: [bot]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, observability, probe, bot]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    volumes: [transcripts:/data]
    depends_on:
      migrate: {condition: service_completed_successfully}
  dashboard:
    <<: *app
    command: [dashboard]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 60s
    volumes: [transcripts:/data:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
  social-worker:
    <<: *app
    command: [social-worker]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, observability, probe, social-worker]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}

networks:
  database: {internal: true}
  outbound: {}
volumes:
  postgres-data: {}
  transcripts: {}
secrets:
  app_env:
    file: ${TUEKA_CONFIG_DIR:?Set a dedicated environment directory}/app.env
  postgres_admin_password:
    file: ${TUEKA_CONFIG_DIR}/postgres-admin-password
  database_password:
    file: ${TUEKA_CONFIG_DIR}/database-password
