<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="{{ bot.avatar_url }}"><link rel="stylesheet" href="/static/dashboard.css"><style>.brand-inline,.account-chip{display:flex;align-items:center;gap:9px}.bot-avatar,.account-chip img,.server-icon{object-fit:cover;border-radius:50%}.bot-avatar{width:34px;height:34px}.account-chip{padding:4px 9px 4px 4px;border:1px solid var(--line);border-radius:999px;font-size:.85rem}.account-chip img{width:28px;height:28px}.server-icon{width:36px;height:36px}</style><script defer src="/static/dashboard.js"></script><title>Tueka</title></head><body><main class="shell"><header class="topbar"><div class="brand-inline"><img class="bot-avatar" src="{{ bot.avatar_url }}" alt="{{ bot.name }}" width="34" height="34" decoding="async"><strong>Tueka</strong></div><div class="preferences"><span class="account-chip"><img src="{{ current_user.avatar_url }}" alt="" width="28" height="28" decoding="async"><span>{{ current_user.name }}</span></span><select data-language aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select><select data-theme aria-label="Theme"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select><a href="/logout" data-i18n="logout">ログアウト</a></div></header><section class="hero"><p class="eyebrow" data-i18n="servers.eyebrow">DASHBOARD</p><h1 data-i18n="servers.title">サーバーを選択</h1><p data-i18n="servers.description">管理できるコミュニティを選択してください。</p></section><section class="server-grid">{% for guild in guilds %}<a class="server-card" href="/servers/{{ guild.id }}">{% if guild.icon_url %}<img class="server-icon" src="{{ guild.icon_url }}" alt="" width="36" height="36" loading="lazy" decoding="async">{% else %}<span class="server-mark">{{ guild.name[0] }}</span>{% endif %}<span>{{ guild.name }}</span><span class="arrow">→</span></a>{% else %}<p data-i18n="servers.empty">管理できるサーバーがありません。</p>{% endfor %}</section></main></body></html>
