<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="/static/dashboard.css"><title>サーバー設定</title></head><body><main><nav><a href="/servers">← サーバー一覧</a><a href="/logout">ログアウト</a></nav><h1>サーバー設定</h1>{% if request.query_params.get('saved') %}<p class="notice">保存しました。</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>管理ログチャンネル<select name="management_channel_id"><option value="">未設定</option>{% for c in channels %}<option value="{{ c.id }}" {% if settings.management_channel_id == c.id|int %}selected{% endif %}># {{ c.name }}</option>{% endfor %}</select></label><label>歓迎チャンネル<select name="welcome_channel_id"><option value="">未設定</option>{% for c in channels %}<option value="{{ c.id }}" {% if settings.welcome_channel_id == c.id|int %}selected{% endif %}># {{ c.name }}</option>{% endfor %}</select></label><label>初期ロール<select name="default_role_id"><option value="">未設定</option>{% for r in roles %}<option value="{{ r.id }}" {% if settings.default_role_id == r.id|int %}selected{% endif %}>{{ r.name }}</option>{% endfor %}</select></label><button type="submit">保存</button></form></main></body></html>
