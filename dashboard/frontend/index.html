<!doctype html>
<html lang="ja" data-appearance="precision" data-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tueka Dashboard</title>
    <script>
      (() => { try { const p = JSON.parse(localStorage.getItem('tueka.preferences') || '{}'); const scheme = p.color_scheme === 'system' || !p.color_scheme ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p.color_scheme; document.documentElement.dataset.appearance = p.appearance || 'precision'; document.documentElement.dataset.colorScheme = scheme; document.documentElement.lang = p.locale || 'ja'; } catch (_) {} })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
